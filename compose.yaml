services:
  flexpower:
    image: ghcr.io/jbkunama1/hai.flexpowerinfo:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:8098:8080"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD setzen}
      MCP_TOKEN: ${MCP_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8098,http://127.0.0.1:8098}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_USER_IDS: ${TELEGRAM_USER_IDS:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
    volumes:
      - flexpower_data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  flexpower_data:
