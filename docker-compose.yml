services:
  flexpower:
    image: ghcr.io/jbkunama1/hai.flexpowerinfo:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:8911:8080"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD setzen}
      PUBLIC_URL: ${PUBLIC_URL:-}
      PUBLIC_DASHBOARD: ${PUBLIC_DASHBOARD:-true}
      MCP_PUBLIC: ${MCP_PUBLIC:-true}
      MCP_TOKEN: ${MCP_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_USER_IDS: ${TELEGRAM_USER_IDS:-}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
    networks: [highfishNetwork]
    volumes: [flexpower_data:/data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  flexpower_data:
networks:
  highfishNetwork:
    external: true
    name: highfishNetwork
